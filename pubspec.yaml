name: articulos_perdidos
description: "Articulos Perdidos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  # req
  cloud_firestore: ^7.2.0
  # req
  firebase_auth: ^7.1.0
  # req 
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  # inicio de session de google
  google_sign_in: ^7.2.0
  # seleccionador de imagenes
  image_picker: ^1.2.4
  # boton de pub.dev
  sign_in_button: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # iconitos
  uses-material-design: true
  # imagenes/carpeta
  assets:
    - assets/images/

